<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout evidence example</title>
    <style>
      :root {
        color: #171717;
        background: #eeeeee;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 390px;
        min-height: 844px;
        padding: 24px 20px;
        background: white;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        line-height: 38px;
      }

      .evidence-note {
        margin: 0;
        color: #666666;
        font-size: 14px;
        line-height: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <p class="evidence-note">
        Remaining content and behavior require additional design evidence.
      </p>
    </main>
  </body>
</html>
